# Cloudflare Workers static assets (not Pages).
# Do not set pages_build_output_dir (that makes wrangler treat this as Pages).
name = "hocl-oem-wholesale"
compatibility_date = "2026-09-22"

[build]
command = "npm run build"

[assets]
directory = "./dist"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

# Custom domain (applied on `wrangler deploy` once CLOUDFLARE_API_TOKEN is set).
# Requires tradeglo.net zone on the same Cloudflare account.
[[routes]]
pattern = "hocl.tradeglo.net"
custom_domain = true
